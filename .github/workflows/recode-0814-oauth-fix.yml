name: Recode 0.81.4 OAuth Fix

on:
  push:
    branches:
      - fix/recode-0.81.4-oauth-only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OAuth-only branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/recode-0.81.4-oauth-only

      - name: Set up Node 26.5
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply isolated OAuth fix
        run: node scripts/recode/apply-oauth-retry-fix.mjs

      - name: Build Recode 0.81.4
        run: |
          npm --prefix packages/tui run build
          npm --prefix packages/ai run build
          npm --prefix packages/agent run build
          npm --prefix packages/coding-agent run build

      - name: Test OAuth provider and retry behavior
        run: |
          npm --prefix packages/ai test -- test/provider-retry.test.ts
          npm --prefix packages/coding-agent test -- test/recode-openai-oauth.test.ts

      - name: Squash to one OAuth-only commit
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            .github/workflows/recode-0814-oauth-fix.yml \
            scripts/recode/apply-oauth-retry-fix.mjs

          git reset --soft 8db98521de6cf8a3b79675246b3a40125c8cf20e
          git add -A

          echo "Changed files:"
          git diff --cached --name-only

          allowed='^(packages/ai/src/api/openai-responses\.ts|packages/ai/src/utils/provider-retry\.ts|packages/ai/test/provider-retry\.test\.ts|packages/coding-agent/src/cli\.ts|packages/coding-agent/src/recode-openai-oauth\.ts|packages/coding-agent/test/recode-openai-oauth\.test\.ts)$'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-OAuth files detected:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(oauth): port working proxy behavior to Recode 0.81.4"
          git push --force origin HEAD:refs/heads/fix/recode-0.81.4-oauth-only

# trigger
