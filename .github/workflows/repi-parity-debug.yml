name: RePi Parity Debug

on:
  pull_request:
    branches:
      - sync/upstream-v0.82.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Fetch legacy Recode source
        run: git fetch origin oauth-test:refs/remotes/origin/oauth-test --force

      - name: Fetch authoritative upstream tags
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch upstream --tags --force

      - name: Set up Node 26.5
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply parity patch
        run: |
          node scripts/repi/remote-parity-patch.mjs
          node scripts/repi/remote-parity-fixes.mjs

      - name: Build patched source
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            npm --prefix packages/tui run build &&
            npm --prefix packages/ai run build &&
            npm --prefix packages/agent run build &&
            npm --prefix packages/storage/sqlite-node run build &&
            npm --prefix packages/coding-agent run build
          } > "$RUNNER_TEMP/parity-build.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload compiler diagnostic
        if: steps.build.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: repi-parity-build-errors
          path: ${{ runner.temp }}/parity-build.log
          if-no-files-found: error
          retention-days: 2

      - name: Show compiler errors
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          grep -nE 'error TS|Error:|ERR_' "$RUNNER_TEMP/parity-build.log" || true
          echo '--- build tail ---'
          tail -n 160 "$RUNNER_TEMP/parity-build.log"
          exit 1

      - name: Validate restored footer
        run: npm --prefix packages/coding-agent test -- test/repi-recode-footer.test.ts

      - name: Stage patched source
        shell: bash
        run: |
          mkdir -p repi
          printf 'Applied and build-validated remotely on Node 26.5.0.\n' > repi/.exact-ui-parity-applied
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src repi/.exact-ui-parity-applied
          git status --short

      - name: Commit patched source locally
        id: commit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git commit -m "fix(repi): restore exact legacy startup and LSP parity" > "$RUNNER_TEMP/parity-commit.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/parity-commit.log"
          exit 0

      - name: Upload commit diagnostic
        if: steps.commit.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: repi-parity-commit-errors
          path: ${{ runner.temp }}/parity-commit.log
          if-no-files-found: error
          retention-days: 2

      - name: Stop after local commit failure
        if: steps.commit.outputs.exit_code != '0'
        run: exit 1

      - name: Push validated staging branch
        id: push
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git push --force origin HEAD:refs/heads/repi/parity-output > "$RUNNER_TEMP/parity-push.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/parity-push.log"
          exit 0

      - name: Upload push diagnostic
        if: steps.push.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: repi-parity-push-errors
          path: ${{ runner.temp }}/parity-push.log
          if-no-files-found: error
          retention-days: 2

      - name: Stop after staging push failure
        if: steps.push.outputs.exit_code != '0'
        run: exit 1
