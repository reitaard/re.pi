name: RePi Parity Cleanup

on:
  pull_request:
    branches:
      - sync/upstream-v0.82.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Fetch authoritative upstream tags
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch upstream --tags --force

      - name: Set up Node 26.5
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove formatter-only changes and temporary machinery
        shell: bash
        run: |
          git checkout a3c7b7bd9b215158f8b0b75dd0115b41603e5c23 -- \
            packages/coding-agent/src/modes/interactive/components/tool-execution.ts \
            packages/coding-agent/src/recode-cli.ts \
            packages/coding-agent/src/repi/delegation/extension.ts \
            packages/coding-agent/src/repi/delegation/external-tool-loader.ts \
            packages/coding-agent/src/repi/delegation/harness-models.ts \
            packages/coding-agent/src/repi/delegation/named-worker.ts \
            packages/coding-agent/src/repi/delegation/worker-directory.ts \
            packages/coding-agent/src/repi/delegation/worker-tools.ts \
            packages/coding-agent/src/repi/memory/extension.ts \
            packages/coding-agent/src/repi/memory/manager.ts \
            packages/coding-agent/src/repi/memory/store.ts \
            packages/coding-agent/src/repi/providers/open-provider.ts \
            packages/coding-agent/src/repi/ui/extension.ts \
            packages/coding-agent/src/repi/ui/recode-footer.ts \
            packages/coding-agent/src/repi/ui/recode-header.ts \
            packages/coding-agent/src/repi/update/extension.ts \
            packages/coding-agent/src/repi/update/release.ts

          git checkout 485e47abf520c3b7af2c51f07cd7011030d48b4e -- .github/workflows/repi-integration.yml

          rm -f \
            .github/workflows/repi-parity-cleanup.yml \
            .github/workflows/repi-parity-debug.yml \
            .github/workflows/repi-remote-parity-patch.yml \
            scripts/repi/remote-parity-patch.mjs \
            scripts/repi/remote-parity-fixes.mjs \
            scripts/repi/apply-exact-ui-parity.mjs \
            repi/.exact-ui-parity-applied

          git diff --stat

      - name: Build clean patched source
        run: |
          npm --prefix packages/tui run build
          npm --prefix packages/ai run build
          npm --prefix packages/agent run build
          npm --prefix packages/storage/sqlite-node run build
          npm --prefix packages/coding-agent run build

      - name: Validate restored footer
        run: npm --prefix packages/coding-agent test -- test/repi-recode-footer.test.ts

      - name: Commit clean validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "chore(repi): finalize clean parity patch"

      - name: Push clean staging branch
        shell: bash
        run: git push --force origin HEAD:refs/heads/repi/cleanup-output
