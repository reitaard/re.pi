name: RePi Integration

on:
  push:
    branches:
      - repi/integrate-v0.82.1
  pull_request:
    branches:
      - sync/upstream-v0.82.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node 26.5.0
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout RePi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch authoritative upstream tags
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch upstream --tags --force

      - name: Set up Node 26.5
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm

      - name: Verify Node release runtime
        run: node -e "if (!process.versions.node.startsWith('26.5.')) throw new Error('Expected Node 26.5.x, got ' + process.versions.node); console.log(process.version)"

      - name: Install dependencies
        id: npm_ci
        continue-on-error: true
        run: |
          set +e
          npm ci > "$RUNNER_TEMP/npm-ci.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload npm ci diagnostic
        if: steps.npm_ci.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-${{ matrix.os }}
          path: ${{ runner.temp }}/npm-ci.log
          if-no-files-found: error
          retention-days: 2

      - name: Stop after npm ci failure
        if: steps.npm_ci.outputs.exit_code != '0'
        run: |
          tail -n 100 "$RUNNER_TEMP/npm-ci.log"
          exit 1

      - name: Build release package graph
        id: repi_build
        continue-on-error: true
        run: |
          set +e
          {
            npm --prefix packages/tui run build &&
            npm --prefix packages/ai run build &&
            npm --prefix packages/agent run build &&
            npm --prefix packages/storage/sqlite-node run build &&
            npm --prefix packages/coding-agent run build
          } > "$RUNNER_TEMP/repi-build.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build diagnostic
        if: steps.repi_build.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: repi-build-${{ matrix.os }}
          path: ${{ runner.temp }}/repi-build.log
          if-no-files-found: error
          retention-days: 2

      - name: Stop after build failure
        if: steps.repi_build.outputs.exit_code != '0'
        run: |
          tail -n 180 "$RUNNER_TEMP/repi-build.log"
          exit 1

      - name: Test RePi layers
        id: repi_tests
        continue-on-error: true
        run: |
          set +e
          {
            npm --prefix packages/coding-agent test -- \
              test/repi-update-release.test.ts \
              test/repi-update-command.test.ts \
              test/repi-update-notifier.test.ts \
              test/repi-open-provider.test.ts \
              test/repi-openai-oauth.test.ts \
              test/repi-kioku-config.test.ts \
              test/repi-kioku-memory.test.ts \
              test/repi-recode-header.test.ts \
              test/repi-recode-footer.test.ts \
              test/repi-tool-execution-status.test.ts
            coding_agent=$?
            npm --prefix packages/ai test -- test/provider-retry.test.ts
            ai=$?
            node --test scripts/repi-version.test.mjs scripts/repi-release-package.test.mjs
            scripts=$?
            if [ "$coding_agent" -ne 0 ]; then exit "$coding_agent"; fi
            if [ "$ai" -ne 0 ]; then exit "$ai"; fi
            exit "$scripts"
          } > "$RUNNER_TEMP/repi-tests.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload focused test diagnostic
        if: steps.repi_tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: repi-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/repi-tests.log
          if-no-files-found: error
          retention-days: 2

      - name: Stop after focused test failure
        if: steps.repi_tests.outputs.exit_code != '0'
        run: |
          tail -n 200 "$RUNNER_TEMP/repi-tests.log"
          exit 1

      - name: Validate release command syntax
        run: node --check scripts/repi/release.mjs

      - name: Pack Recode npm artifact
        run: npm run repi:pack -- --skip-build

      - name: Smoke-install packed Recode
        run: |
          TARBALL="$(ls -1 .artifacts/*.tgz | tail -n 1)"
          PREFIX="$RUNNER_TEMP/repi-smoke"
          npm install --prefix "$PREFIX" --ignore-scripts "$TARBALL"
          node "$PREFIX/node_modules/@reitaard/repi-coding-agent/dist/recode-cli.js" --version
