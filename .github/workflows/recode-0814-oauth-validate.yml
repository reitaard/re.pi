name: Validate Recode 0.81.4 OAuth Patch

on:
  push:
    branches:
      - fix/recode-0.81.4-oauth-only
  pull_request:
    branches:
      - rollback/recode-0.81.4-pre-oauth

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OAuth branch
        uses: actions/checkout@v4
        with:
          ref: fix/recode-0.81.4-oauth-only
          fetch-depth: 0

      - name: Set up Node 26.5
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Recode 0.81.4
        run: |
          npm --prefix packages/tui run build
          npm --prefix packages/ai run build
          npm --prefix packages/agent run build
          npm --prefix packages/coding-agent run build

      - name: Test OAuth provider
        run: npm --prefix packages/coding-agent test -- test/recode-openai-oauth.test.ts

      - name: Verify OAuth-only scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 8db98521de6cf8a3b79675246b3a40125c8cf20e...HEAD | grep -v '^.github/workflows/recode-0814-oauth-validate.yml$')"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(packages/ai/src/api/openai-responses\.ts|packages/coding-agent/src/cli\.ts|packages/coding-agent/src/recode-openai-oauth\.ts|packages/coding-agent/test/recode-openai-oauth\.test\.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files detected:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
