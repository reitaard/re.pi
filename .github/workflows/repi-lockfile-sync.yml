name: RePi Lockfile Sync

on:
  pull_request:
    branches:
      - sync/upstream-v0.82.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: repi/integrate-v0.82.1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Synchronize coding-agent workspace metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageManifest = JSON.parse(fs.readFileSync('packages/coding-agent/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const workspace = lock.packages?.['packages/coding-agent'];
          if (!workspace) throw new Error('package-lock workspace packages/coding-agent is missing');
          workspace.bin = packageManifest.bin;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, '\t')}\n`, 'utf8');
          NODE

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(repi): synchronize workspace lockfile"
          git pull --rebase origin repi/integrate-v0.82.1
          git push origin HEAD:repi/integrate-v0.82.1

# One-time integration helper. Remove after the synchronized lockfile commit lands.
