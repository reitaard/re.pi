name: RePi Lockfile Sync

on:
  push:
    branches:
      - repi/integrate-v0.82.1
    paths:
      - .github/workflows/repi-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: repi/integrate-v0.82.1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(repi): synchronize workspace lockfile"
          git push origin HEAD:repi/integrate-v0.82.1

# One-time integration helper. Remove after the synchronized lockfile commit lands.
